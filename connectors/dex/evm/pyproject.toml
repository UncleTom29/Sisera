[project]
name = "sisera-dex-evm"
version = "0.1.0"
description = "Sisera EVM DEX aggregator connector (1inch-style quotes, no signing)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "sisera-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_dex_evm"]

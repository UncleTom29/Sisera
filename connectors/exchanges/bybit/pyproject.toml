[project]
name = "sisera-bybit"
version = "0.1.0"
description = "Sisera Bybit venue connector: Bybit V5 behind the canonical VenueAdapter"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
    "sisera-schemas",
    "sisera-config",
    "sisera-marketdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_bybit"]

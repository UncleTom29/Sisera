[project]
name = "sisera-ccxt"
version = "0.1.0"
description = "Sisera generic CCXT venue connector (second CEX, e.g. Binance) behind the canonical interface"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "sisera-domain",
    "sisera-schemas",
    "sisera-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_ccxt"]

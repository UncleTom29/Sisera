[project]
name = "sisera-hyperliquid"
version = "0.1.0"
description = "Sisera Hyperliquid venue connector (perps + spot) behind the canonical interface"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "sisera-domain",
    "sisera-schemas",
    "sisera-config",
    "sisera-marketdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_hyperliquid"]

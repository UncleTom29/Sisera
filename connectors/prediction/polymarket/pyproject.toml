[project]
name = "sisera-polymarket"
version = "0.1.0"
description = "Sisera Polymarket prediction-market connector (Gamma discovery + CLOB public data)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "sisera-domain",
    "sisera-schemas",
    "sisera-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_polymarket"]

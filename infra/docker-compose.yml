name: sisera

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sisera
      POSTGRES_USER: sisera
      POSTGRES_PASSWORD: sisera
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/db/migrations/0000_rebuild.sql:/docker-entrypoint-initdb.d/0000_rebuild.sql:ro
      - ../packages/db/migrations/0001_portfolio_ledger_agents.sql:/docker-entrypoint-initdb.d/0001_portfolio_ledger_agents.sql:ro
      - ../packages/db/migrations/0002_privy_identity.sql:/docker-entrypoint-initdb.d/0002_privy_identity.sql:ro
      - ../packages/db/migrations/0003_solana_webhook_events.sql:/docker-entrypoint-initdb.d/0003_solana_webhook_events.sql:ro
      - ../packages/db/migrations/0004_solana_swap_orders.sql:/docker-entrypoint-initdb.d/0004_solana_swap_orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisera -d sisera"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3001:3000"]
    volumes: ["grafana_data:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  postgres_data:
  redis_data:
  grafana_data:

[project]
name = "sisera-db"
version = "0.1.0"
description = "Sisera shared SQLAlchemy types (exact Decimal, common columns)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_db"]

[project]
name = "sisera-domain"
version = "0.1.0"
description = "Sisera canonical domain financial types (Decimal-based value objects)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_domain"]

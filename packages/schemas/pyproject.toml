[project]
name = "sisera-schemas"
version = "0.1.0"
description = "Sisera canonical typed event schemas (market data + order lifecycle)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sisera-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisera"
version = "0.1.0"
description = "Derivatives-native crypto trading bot (Bybit perpetuals)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "requests>=2.32",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "websocket-client>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "feedparser>=6.0",
    "telethon>=1.36",
    "sisera-domain",
    "sisera-config",
    "sisera-schemas",
    "sisera-marketdata",
    "sisera-ledger",
    "sisera-db",
    "sisera-oms",
    "sisera-instruments",
    "sisera-portfolio",
    "sisera-bybit",
    "sisera-hyperliquid",
    "sisera-polymarket",
    "sisera-api",
    "sisera-auth",
    "sisera-quant",
    "sisera-risk-monitor",
    "sisera-agents",
    "sisera-intelligence",
    "sisera-observability",
]

[project.scripts]
sisera = "sisera.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "ruff>=0.16",
    "httpx>=0.27",
    "hypothesis>=6.168",
]

[tool.uv.workspace]
members = [
    "packages/domain",
    "packages/config",
    "packages/schemas",
    "packages/db",
    "packages/observability",
    "services/market-data",
    "services/ledger",
    "services/oms",
    "services/instrument-master",
    "services/portfolio",
    "services/api",
    "services/auth",
    "services/agents",
    "services/intelligence",
    "quant/backtesting",
    "workers/risk-monitor",
    "connectors/exchanges/bybit",
    "connectors/exchanges/hyperliquid",
    "connectors/prediction/polymarket",
]

[tool.uv.sources]
sisera-domain = { workspace = true }
sisera-config = { workspace = true }
sisera-schemas = { workspace = true }
sisera-marketdata = { workspace = true }
sisera-ledger = { workspace = true }
sisera-db = { workspace = true }
sisera-oms = { workspace = true }
sisera-instruments = { workspace = true }
sisera-portfolio = { workspace = true }
sisera-bybit = { workspace = true }
sisera-api = { workspace = true }
sisera-auth = { workspace = true }
sisera-quant = { workspace = true }
sisera-risk-monitor = { workspace = true }
sisera-agents = { workspace = true }
sisera-hyperliquid = { workspace = true }
sisera-polymarket = { workspace = true }
sisera-intelligence = { workspace = true }
sisera-observability = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "connectors", "quant", "workers"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "BLE"]

[project]
name = "sisera-quant"
version = "0.1.0"
description = "Sisera quantitative research: event-driven backtesting on the canonical domain"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_quant"]

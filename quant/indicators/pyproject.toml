[project]
name = "sisera-quant-indicators"
version = "0.1.0"
description = "Sisera indicator engine (migrated from sisera/indicators)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_quant_indicators"]

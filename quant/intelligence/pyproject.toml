[project]
name = "sisera-quant-intelligence"
version = "0.1.0"
description = "Sisera market/position intelligence engines (migrated from sisera/intelligence)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sisera-quant-opportunity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_quant_intelligence"]

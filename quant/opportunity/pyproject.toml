[project]
name = "sisera-quant-opportunity"
version = "0.1.0"
description = "Sisera opportunity engine and decision policy (migrated from sisera/opportunity)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sisera-quant-scoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_quant_opportunity"]

[project]
name = "sisera-quant-scoring"
version = "0.1.0"
description = "Sisera scoring and ranking (migrated from sisera/scoring)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.9",
    "sisera-quant-indicators",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_quant_scoring"]

[project]
name = "sisera-api"
version = "0.1.0"
description = "Sisera API service: versioned FastAPI over the canonical repositories"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sisera-domain",
    "sisera-config",
    "sisera-ledger",
    "sisera-oms",
    "sisera-instruments",
    "sisera-portfolio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_api"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

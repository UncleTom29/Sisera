[project]
name = "sisera-auth"
version = "0.1.0"
description = "Sisera auth service: persistence for organizations, desks, users, and memberships"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.10",
    "cryptography>=40.0",
    "sisera-domain",
    "sisera-config",
    "sisera-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_auth"]

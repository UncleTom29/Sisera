[project]
name = "sisera-intelligence"
version = "0.1.0"
description = "Sisera intelligence service: evidence-grounded AI copilot over market, portfolio, and risk state"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
    "sisera-schemas",
    "sisera-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_intelligence"]

[project]
name = "sisera-oms"
version = "0.1.0"
description = "Sisera OMS service: SQLAlchemy persistence for orders and their lifecycle"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sisera-domain",
    "sisera-config",
    "sisera-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_oms"]

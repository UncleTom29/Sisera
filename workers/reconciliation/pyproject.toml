[project]
name = "sisera-reconciliation"
version = "0.1.0"
description = "Sisera reconciliation worker: venue-vs-ledger discrepancy detection"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
    "sisera-ledger",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_reconciliation"]

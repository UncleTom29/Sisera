[project]
name = "sisera-risk-monitor"
version = "0.1.0"
description = "Sisera risk-monitor worker: portfolio surveillance with kill switches and alerts"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
    "sisera-portfolio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_risk_monitor"]

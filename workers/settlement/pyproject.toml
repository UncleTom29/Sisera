[project]
name = "sisera-settlement"
version = "0.1.0"
description = "Sisera settlement worker: posts fills and prediction settlements to the financial ledger"
requires-python = ">=3.12"
dependencies = [
    "sisera-domain",
    "sisera-ledger",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sisera_settlement"]
